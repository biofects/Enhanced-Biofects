Enhanced-Biofects:
  card-mod-theme: Enhanced-Biofects

  ### Backdrop for Dialog ###
  dialog-backdrop-filter: blur(8px)
  iron-overlay-backdrop-opacity: 1
  iron-overlay-backdrop-background-color: rgba(0, 0, 0, 0.5)
  ha-dialog-surface-background: "rgba(0, 15, 30, 0.96)"
  ha-dialog-surface-backdrop-filter: blur(12px)
  ha-dialog-scrim-backdrop-filter: blur(8px)
  ha-bottom-sheet-surface-background: "rgba(0, 15, 30, 0.98)"
  ha-bottom-sheet-scrim-color: "rgba(0, 0, 0, 0.72)"
  mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.72)"

  ### Header Height ###
  header-height: 40px

  ### Main Interface Colors ###
  color-scheme: "dark"
  lovelace-background: 'center / cover no-repeat url("/local/backgrounds/enhanced-biofects.png") fixed'
  app-header-background-color: "rgba(0, 15, 30, 0.7)"
  card-background-color: "rgba(0, 15, 30, 0.7)"
  primary-color: "#00FFFF"  # Bright Turquoise
  light-primary-color: "#80FFFF"  # Very Light Turquoise
  mdc-theme-on-primary: var(--text-primary-color)
  mdc-theme-on-secondary: var(--text-primary-color)
  # Translucent (was solid #001F1F) so the background image shows through
  # hass-tabs-subpage and hass-subpage - the shared layout for nearly every
  # Settings sub-page and Profile, which paint :host{background-color:
  # var(--primary-background-color)} directly and aren't reachable by any
  # card-mod hook. Ingress/iframe panels stay unaffected in practice: their
  # embedded page's own opaque content fully covers this the instant it loads.
  primary-background-color: "rgba(0, 31, 31, 0.7)"
  secondary-background-color: "#000000"
  rgb-secondary-background-color: 0, 0, 0
  divider-color: "#005F5F"
  markdown-code-background-color: "#002F2F"

  ### Text Colors ###
  primary-text-color: "#00FFFF"  # Bright Turquoise
  secondary-text-color: "#80FFFF"  # Very Light Turquoise
  text-primary-color: "#001F1F"
  disabled-text-color: "#008080"

  ### Sidebar Menu ###
  sidebar-icon-color: "#00FFFF"
  sidebar-text-color: "#00FFFF"
  sidebar-selected-background-color: "rgba(0, 15, 30, 0.9)"
  sidebar-selected-icon-color: "#80FFFF"
  sidebar-selected-text-color: var(--sidebar-selected-icon-color)
  sidebar-background-color: "rgba(0, 15, 30, 0.7)"

  ### States and Badges ###
  state-icon-color: var(--primary-color)
  state-icon-active-color: "#80FFFF"
  state-icon-unavailable-color: var(--disabled-text-color)

  ### Sliders ###
  paper-slider-knob-color: var(--primary-color)
  paper-slider-knob-start-color: var(--primary-color)
  paper-slider-pin-color: var(--primary-color)
  paper-slider-active-color: var(--primary-color)
  paper-slider-secondary-color: var(--light-primary-color)

  ### Labels ###
  label-badge-background-color: var(--markdown-code-background-color)
  label-badge-text-color: var(--primary-text-color)
  label-badge-red: "#FF4136"
  label-badge-yellow: "#FFDC00"

  ### Card Styling for Enhanced LED Effect ###
  ha-card-border-radius: '10px'
  ha-card-background: "rgba(0, 15, 30, 0.7)"
  ha-card-box-shadow: >
    0 0 10px rgba(0, 255, 255, 0.3),
    0 0 20px rgba(0, 255, 255, 0.2),
    0 0 30px rgba(0, 255, 255, 0.1)

  ### Toggles ###
  paper-toggle-button-checked-button-color: "#00FFFF"
  paper-toggle-button-checked-bar-color: var(--light-primary-color)
  paper-toggle-button-unchecked-button-color: var(--paper-toggle-button-checked-button-color)
  paper-toggle-button-unchecked-bar-color: "#005F5F"

  ### Table Rows ###
  table-header-background-color: "rgba(0, 31, 31, 0.98)"
  table-row-background-color: "rgba(0, 15, 30, 0.92)"
  table-row-alternative-background-color: "rgba(0, 31, 31, 0.92)"
  data-table-background-color: "rgba(0, 15, 30, 0.96)"

  ### Switches ###
  switch-unchecked-button-color: var(--divider-color)
  switch-unchecked-track-color: var(--divider-color)

  ### Inputs ###
  input-fill-color: "rgba(0, 255, 255, 0.05)"
  input-label-ink-color: var(--primary-color)
  input-ink-color: var(--primary-color)
  input-disabled-fill-color: "rgba(0, 0, 0, 0.33)"
  input-disabled-ink-color: var(--disabled-primary-color)

  ### Select / Dropdown Fields (profile page, more-info dialogs, etc.) ###
  # These live in nested shadow DOM that card-mod-root's CSS below can't reach,
  # so they need real theme tokens or they fall back to Material's white fill.
  # HA 2026.x rewrote ha-select on top of ha-picker-field / ha-combo-box-item,
  # which reads its background/border from these --ha-color-* tokens, not the
  # older mdc-select/md-sys-color-* tokens below.
  ha-color-form-background: "rgba(0, 15, 30, 0.9)"
  ha-color-form-background-hover: "rgba(0, 31, 31, 0.9)"
  ha-color-form-background-disabled: "rgba(0, 0, 0, 0.33)"
  ha-color-fill-primary-quiet-resting: "rgba(0, 31, 31, 0.72)"
  ha-color-fill-primary-quiet-hover: "rgba(0, 95, 95, 0.72)"
  ha-color-fill-primary-quiet-active: "rgba(0, 31, 31, 0.9)"
  ha-color-fill-primary-normal-resting: "rgba(0, 95, 95, 0.9)"
  ha-color-fill-primary-normal-hover: "rgba(0, 128, 128, 0.9)"
  ha-color-fill-primary-normal-active: "rgba(0, 95, 95, 0.98)"
  ha-color-on-primary-quiet: var(--light-primary-color)
  ha-color-on-primary-normal: var(--primary-color)
  ha-color-on-primary-loud: var(--text-primary-color)
  ha-color-fill-neutral-quiet-resting: "rgba(0, 31, 31, 0.9)"
  ha-color-fill-neutral-quiet-hover: "rgba(0, 95, 95, 0.72)"
  ha-color-fill-neutral-quiet-active: "rgba(0, 31, 31, 0.98)"
  ha-color-fill-neutral-normal-resting: "rgba(0, 31, 31, 0.9)"
  ha-color-fill-neutral-normal-hover: "rgba(0, 95, 95, 0.9)"
  ha-color-fill-neutral-normal-active: "rgba(0, 31, 31, 0.98)"
  ha-color-on-neutral-quiet: var(--secondary-text-color)
  ha-color-on-neutral-normal: var(--primary-text-color)
  ha-color-on-neutral-loud: var(--text-primary-color)
  ha-color-border-neutral-quiet: "rgba(0, 255, 255, 0.15)"
  ha-color-border-neutral-normal: "rgba(0, 255, 255, 0.3)"
  ha-color-border-neutral-loud: "rgba(0, 255, 255, 0.5)"
  ha-color-text-primary: var(--primary-text-color)
  ha-color-text-secondary: var(--secondary-text-color)
  popup-background-color: "rgba(0, 15, 30, 0.95)"
  outline-color: var(--divider-color)
  mdc-select-fill-color: "rgba(0, 15, 30, 0.9)"
  mdc-select-ink-color: "#FFFFFF"
  mdc-select-label-ink-color: var(--light-primary-color)
  mdc-select-idle-line-color: var(--divider-color)
  mdc-select-disabled-ink-color: var(--disabled-text-color)
  mdc-menu-surface-fill-color: var(--popup-background-color)
  mdc-list-item-text-color: "#FFFFFF"
  mwc-list-item-text-color: "#FFFFFF"
  mdc-text-field-fill-color: var(--input-fill-color)
  mdc-text-field-ink-color: var(--input-ink-color)
  mdc-text-field-label-ink-color: var(--input-label-ink-color)
  mdc-text-field-idle-line-color: var(--divider-color)
  mdc-text-field-disabled-fill-color: var(--input-disabled-fill-color)
  mdc-text-field-disabled-ink-color: var(--disabled-text-color)
  md-sys-color-surface: var(--popup-background-color)
  md-sys-color-surface-container: var(--popup-background-color)
  md-sys-color-surface-container-low: var(--primary-background-color)
  md-sys-color-surface-container-high: var(--secondary-background-color)
  md-sys-color-surface-container-highest: var(--card-background-color)
  md-sys-color-surface-variant: var(--card-background-color)
  md-sys-color-on-surface: var(--primary-text-color)
  md-sys-color-on-surface-variant: var(--secondary-text-color)
  md-sys-color-primary: var(--primary-color)
  md-sys-color-outline: var(--outline-color)
  md-sys-color-outline-variant: var(--divider-color)
  md-sys-color-background: var(--primary-background-color)
  md-sys-color-on-background: var(--primary-text-color)

  ### Custom CSS for specific element styling ###
  # Background image behind non-Lovelace panels (Settings, Profile, Developer
  # Tools, ...). card-mod-root only reaches hui-root (the Lovelace chrome), so
  # it can't be used for this. card-mod-sidebar is the working hook for the
  # sidebar; the rest paint the image at each panel's own root, paired with
  # the primary-background-color change above (which covers hass-tabs-subpage
  # - the layout most Settings sub-pages and Profile use, and which card-mod
  # has no hook for at all).
  #
  # Known limitations:
  # - Profile and custom panels (e.g. HACS) aren't covered - card-mod has no
  #   hook reaching ha-panel-profile or third-party panels at all, confirmed
  #   against its full patch list.
  # - Ingress panels (iframe-embedded UIs) are NOT covered - card-mod's
  #   panel-custom hook explicitly doesn't support iframes, and CSS can't cross
  #   an iframe boundary at all regardless. In practice this doesn't matter:
  #   the embedded page's own opaque content fully covers ha-panel-iframe's
  #   fallback background the instant it loads.
  # Side effect on Lovelace dashboards: since the sidebar now paints its own
  # copy of the background image (needed to make it visible on Settings/admin
  # panels), dashboards end up with two overlapping copies of the same image -
  # one on the sidebar, one on Lovelace's own true viewport-fixed background
  # behind it. Normally indistinguishable (identical, aligned), but they
  # animate independently: overscrolling past the top/bottom of a dashboard
  # triggers Chrome's rubber-band bounce, which moves the sidebar's copy (it's
  # part of the sidebar's own box) while the fixed layer behind it doesn't,
  # briefly showing both as they fall out of alignment.
  # Content areas darken the raw image via ha-card's own translucent fill
  # (rgba(0, 15, 30, 0.7)) sitting on top of it. The sidebar has no such
  # layer, so bright parts of the image (e.g. horizontal highlight bands)
  # can clash with the sidebar's own cyan text where they cross. Stack the
  # same translucent color over the image here too, for consistency.
  card-mod-sidebar: |
    :host {
      background:
        linear-gradient(rgba(0, 15, 30, 0.7), rgba(0, 15, 30, 0.7)),
        var(--lovelace-background);
    }
  card-mod-top-app-bar-fixed: |
    :host {
      background: var(--lovelace-background);
    }
  # ha-panel-config and ha-panel-developer-tools (both HassRouterPage-based)
  # render in light DOM - no shadow root at all - confirmed live: no
  # <template shadowrootmode> in the DOM. :host matches nothing there; it
  # must be a plain tag selector instead. Also needs explicit sizing: neither
  # has any static styles of its own (confirmed live - background-image
  # computes correctly but nothing painted), so as a bare custom element it
  # has no box to paint a background into without one.
  # Make integrations in an error state unmistakable without changing healthy
  # cards. Each selector step ends at a shadow root so card-mod can retry as
  # Home Assistant loads the routed dashboard and integration cards.
  card-mod-config-yaml: |
    ".": |
      ha-panel-config {
        display: block;
        height: 100%;
        background: var(--lovelace-background);
      }
    "ha-config-integrations-dashboard $":
      "ha-integration-card $": |
        ha-card.state-error {
          --ha-card-border-width: 3px;
          --ha-card-background: linear-gradient(
            rgba(255, 65, 54, 0.16),
            rgba(0, 15, 30, 0.88)
          );
          box-shadow:
            0 0 8px rgba(255, 65, 54, 0.9),
            0 0 20px rgba(255, 65, 54, 0.45);
        }
  card-mod-developer-tools: |
    ha-panel-developer-tools {
      display: block;
      height: 100%;
      background: var(--lovelace-background);
    }

  card-mod-root: |
    /* Make sidebar transparent */
    ha-sidebar {
      background-color: rgba(0, 15, 30, 0.7) !important;
    }
    
    /* Make main title transparent and adjust color */
    .main-title {
      background-color: transparent !important;
      color: #00FFFF !important;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    
    /* Adjust text color throughout */
    * {
      color: #00FFFF !important;
    }
    
    /* Preserve some contrast for readability */
    ha-card * {
      color: #80FFFF !important;
    }

    /* Add LED-like glow to text */
    ha-card *, .main-title, ha-sidebar * {
      text-shadow: 
        0 0 5px rgba(0, 255, 255, 0.5),
        0 0 10px rgba(0, 255, 255, 0.3);
    }

    /* Enhance LED effect for icons */
    ha-icon {
      filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.7));
    }

    /* Keep native and custom-card tables on the dark theme surfaces */
    table,
    thead,
    tbody,
    tfoot {
      background-color: var(--data-table-background-color) !important;
    }
    thead tr,
    th {
      background-color: var(--table-header-background-color) !important;
    }
    tbody tr:nth-child(odd),
    tbody tr:nth-child(odd) td {
      background-color: var(--table-row-background-color) !important;
    }
    tbody tr:nth-child(even),
    tbody tr:nth-child(even) td {
      background-color: var(--table-row-alternative-background-color) !important;
    }
    th,
    td {
      color: #FFFFFF !important;
      border-color: var(--divider-color) !important;
    }

    /* Style form fields */
    .mdc-text-field--filled:not(.mdc-text-field--disabled) {
      background-color: rgba(0, 15, 30, 0.9);
    }
    .mdc-text-field:not(.mdc-text-field--disabled) .mdc-text-field__input,
    .mdc-select:not(.mdc-select--disabled) .mdc-select__selected-text,
    .mdc-select:not(.mdc-select--disabled) .mdc-select__anchor {
      color: #FFFFFF !important;
    }
    .mdc-floating-label,
    .mdc-text-field:not(.mdc-text-field--disabled) .mdc-floating-label {
      color: #80FFFF !important;
    }
    
    /* Style calendar header */
    .fc .fc-col-header-cell-cushion {
      color: #00FFFF !important;
    }
    .fc .fc-col-header-cell {
      background-color: rgba(0, 15, 30, 0.9) !important;
    }
    
    /* Ensure all inputs have white text */
    input, select, textarea {
      color: #FFFFFF !important;
    }

    /* Style mdc-fab buttons */
    .mdc-fab.mdc-fab--extended {
      background-color: #00FFFF !important;
    }
    .mdc-fab.mdc-fab--extended .mdc-fab__label {
      color: var(--text-primary-color) !important;
      font-weight: bold;
    }
    .mdc-fab.mdc-fab--extended:hover {
      background-color: #80FFFF !important;
    }
    .mdc-fab.mdc-fab--extended:hover .mdc-fab__label {
      color: var(--text-primary-color) !important;
    }

    /* Keep button content readable on bright primary surfaces */
    button, 
    .mdc-button,
    .mdc-button .mdc-button__label,
    :host .mdc-fab,
    :host .mdc-fab:disabled .mdc-fab__icon,
    :host .mdc-fab:disabled .mdc-fab__label,
    :host .mdc-fab:not(:disabled) .mdc-fab__icon,
    :host .mdc-fab:not(:disabled) .mdc-fab__label,
    .mdc-fab__label {
      color: var(--text-primary-color) !important;
    }

    /* Keep today's date readable on its primary-color circle */
    td.fc-day-today .fc-daygrid-day-number {
      color: var(--text-primary-color) !important;
      font-weight: bold;
    }

    /* Ensure contrast for disabled buttons */
    :host .mdc-fab:disabled {
      background-color: #CCCCCC !important;
    }

    /* Maintain contrasting text on hover for fab buttons */
    .mdc-fab:hover .mdc-fab__label {
      color: var(--text-primary-color) !important;
    }
 
    /* Style placeholder text */
    ::placeholder {
      color: rgba(255, 255, 255, 0.5) !important;
    }
